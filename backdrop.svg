<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- The backdrop behind the title, the character screen and the Oath: night on the
       ridge above Riverford. In the north the sky is torn and its light pours down on
       the Tower; the Oathstones stand in the foreground; embers climb. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060d"/>
      <stop offset="0.55" stop-color="#0d1020"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
    <radialGradient id="tearGlow" cx="50%" cy="22%" r="38%">
      <stop offset="0" stop-color="#cfe6ff" stop-opacity="0.75"/>
      <stop offset="0.25" stop-color="#7fb2ff" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#3d6bd0" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#3d6bd0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e8f3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2140"/>
      <stop offset="1" stop-color="#0d1020"/>
    </linearGradient>
    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121628"/>
      <stop offset="1" stop-color="#0a0c16"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15110c"/>
      <stop offset="1" stop-color="#070503"/>
    </linearGradient>
    <radialGradient id="stoneGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0" stop-color="#e6c36f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e6c36f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>
    <filter id="blur18" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#night)"/>

  <!-- stars -->
  <g fill="#dfe8ff">
    <circle cx="120" cy="140" r="1.6" opacity="0.8"/><circle cx="310" cy="80" r="1.1" opacity="0.6"/><circle cx="420" cy="230" r="1.3" opacity="0.7"/>
    <circle cx="640" cy="120" r="1" opacity="0.5"/><circle cx="1500" cy="90" r="1.5" opacity="0.8"/><circle cx="1680" cy="210" r="1.2" opacity="0.6"/>
    <circle cx="1780" cy="110" r="1" opacity="0.5"/><circle cx="1420" cy="300" r="1" opacity="0.45"/><circle cx="220" cy="330" r="1" opacity="0.45"/>
    <circle cx="1820" cy="380" r="1.3" opacity="0.6"/><circle cx="90" cy="460" r="1.1" opacity="0.5"/><circle cx="760" cy="60" r="1.2" opacity="0.6"/>
    <circle cx="1120" cy="70" r="1" opacity="0.5"/><circle cx="1260" cy="180" r="1.4" opacity="0.6"/><circle cx="560" cy="380" r="0.9" opacity="0.4"/>
  </g>

  <!-- the tear in the sky, and its light -->
  <ellipse cx="960" cy="240" rx="520" ry="300" fill="url(#tearGlow)"/>
  <path d="M960 -20 L948 120 L974 210 L952 330 L968 420 L958 500" fill="none" stroke="#e8f3ff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#blur18)"/>
  <path d="M960 -20 L948 120 L974 210 L952 330 L968 420 L958 500" fill="none" stroke="#f4f9ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#blur2)"/>
  <path d="M960 -20 L948 120 L974 210 L952 330 L968 420 L958 500" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M948 120 L900 160 M974 210 L1030 250 M952 330 L905 372" fill="none" stroke="#cfe6ff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- the light falls on the ridge -->
  <polygon points="900,420 1020,420 1180,760 740,760" fill="url(#shaft)" opacity="0.5" filter="url(#blur6)"/>

  <!-- far ridge, and the Tower under the tear -->
  <path d="M0 700 L140 640 L260 672 L380 600 L520 650 L660 585 L800 640 L900 610 L1020 610 L1140 650 L1280 575 L1420 640 L1560 598 L1700 660 L1820 620 L1920 650 L1920 1080 L0 1080 Z" fill="url(#ridgeFar)"/>
  <path d="M944 612 L948 450 L960 420 L972 450 L976 612 Z" fill="#070912"/>
  <path d="M938 612 L982 612 L976 596 L944 596 Z" fill="#070912"/>
  <circle cx="960" cy="446" r="4" fill="#dff0ff" opacity="0.9" filter="url(#blur2)"/>

  <!-- middle ridge -->
  <path d="M0 790 L160 740 L300 770 L460 710 L620 760 L780 725 L960 765 L1120 720 L1300 770 L1480 735 L1640 775 L1800 740 L1920 770 L1920 1080 L0 1080 Z" fill="url(#ridgeMid)"/>

  <!-- the near ground, and the Oathstones -->
  <path d="M0 880 L240 850 L520 870 L800 845 L1080 870 L1360 850 L1640 872 L1920 855 L1920 1080 L0 1080 Z" fill="url(#ground)"/>
  <ellipse cx="640" cy="905" rx="260" ry="90" fill="url(#stoneGlow)"/>
  <!-- three stones: the nearest carries the ring of the Oath -->
  <path d="M560 1000 L572 820 Q586 790 604 790 Q626 790 638 822 L652 1000 Z" fill="#17120d" stroke="#b08d57" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="606" cy="880" r="34" fill="none" stroke="#e6c36f" stroke-width="4" stroke-dasharray="190 24" stroke-linecap="round"/>
  <circle cx="606" cy="880" r="34" fill="none" stroke="#e6c36f" stroke-width="12" opacity="0.25" filter="url(#blur6)"/>
  <path d="M720 980 L727 866 Q735 846 748 846 Q762 846 769 868 L777 980 Z" fill="#110d09" stroke="#7a6240" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M470 985 L476 884 Q483 866 494 866 Q506 866 512 886 L518 985 Z" fill="#110d09" stroke="#6b5538" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- embers climbing from the fields -->
  <g fill="#ffb347">
    <circle cx="300" cy="900" r="2.2" opacity="0.8"/><circle cx="360" cy="820" r="1.6" opacity="0.6"/><circle cx="430" cy="760" r="1.3" opacity="0.45"/>
    <circle cx="880" cy="930" r="2" opacity="0.8"/><circle cx="940" cy="860" r="1.5" opacity="0.6"/><circle cx="1010" cy="790" r="1.2" opacity="0.4"/>
    <circle cx="1240" cy="910" r="2.1" opacity="0.8"/><circle cx="1290" cy="840" r="1.5" opacity="0.6"/><circle cx="1340" cy="770" r="1.2" opacity="0.4"/>
    <circle cx="1580" cy="920" r="1.9" opacity="0.7"/><circle cx="1630" cy="850" r="1.4" opacity="0.5"/><circle cx="160" cy="960" r="1.8" opacity="0.7"/>
  </g>

  <!-- the edges fall into dark, so the words on top can be read -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
